name: Test GitHub Pages

on:
  push:
    branches:
      - feat/*
      - fix/*

jobs:
  preview:
    runs-on: ubuntu-latest
    name: Tests
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Install dependencies
        run: yarn install

      - name: Run Test
        run: yarn test
